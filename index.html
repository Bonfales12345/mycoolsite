<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Website</title>
    <meta property="og:title" content="My Website" />
    <meta property="og:description" content="Click to enter my cool website!" />
    <meta property="og:url" content="https://bonfales12345.github.io/mycoolsite/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://bonfales12345.github.io/mycoolsite/preview.jpg" />
    <meta name="theme-color" content="#000000" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }
        video {
            width: 100%; height: 100%;
            object-fit: contain;
            display: none;
        }
    </style>
</head>
<body>
    <div id="overlay">Click to enter my cool website!</div>
    <video id="rickroll" src="rickroll.mp4" loop playsinline></video>
    <script>
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('rickroll');
        window.addEventListener('load', () => {
            video.muted = true;
            video.style.display = 'block';
            overlay.style.display = 'none';
            video.play().then(() => {
                document.addEventListener('click', () => { video.muted = false; }, { once: true });
            }).catch(() => {
                video.muted = false;
                overlay.style.display = 'flex';
                video.style.display = 'none';
                overlay.addEventListener('click', () => {
                    overlay.style.display = 'none';
                    video.style.display = 'block';
                    video.play();
                });
            });
        });
        let triggered = false;
        function check() {
            if (triggered) return;
            if (
                window.outerWidth - window.innerWidth > 160 ||
                window.outerHeight - window.innerHeight > 160 ||
                (window.outerWidth < 800 && screen.width >= 1024)
            ) {
                triggered = true;
                location.replace('about:blank');
            }
        }
        setInterval(check, 1);
        window.addEventListener('resize', check);
        document.addEventListener('visibilitychange', check);
    </script>
</body>
</html>
